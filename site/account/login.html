<script>
(function () {
  if (!window.RCAccount) return;

  var mode = 'signin'; // or 'signup'
  var form = document.getElementById('rcAccountForm');
  var submitBtn = document.getElementById('rcAccountSubmit');
  var errEl = document.getElementById('rcAccountError');
  var noticeEl = document.getElementById('rcAccountNotice');
  var titleEl = document.getElementById('rcAccountTitle');
  var subEl = document.getElementById('rcAccountSub');
  var switchWrap = document.getElementById('rcAccountSwitch');
  var modeBtn = document.getElementById('rcAccountModeBtn');

  // Already signed in? Go straight to the portal.
  RCAccount.getSession().then(function (session) {
    if (session) window.location.href = '/account/';
  });

  function renderMode() {
    errEl.textContent = '';
    noticeEl.textContent = '';
    if (mode === 'signin') {
      titleEl.textContent = 'Sign in to your account';
      subEl.textContent = 'Check your active rentals, history and swap chains.';
      submitBtn.textContent = 'Sign In';
      switchWrap.innerHTML = 'New here? <button type="button" id="rcAccountModeBtn">Create an account</button>';
    } else {
      titleEl.textContent = 'Create your account';
      subEl.textContent = 'Sign up with the email and password you want to use going forward.';
      submitBtn.textContent = 'Create Account';
      switchWrap.innerHTML = 'Already have an account? <button type="button" id="rcAccountModeBtn">Sign in instead</button>';
    }
    document.getElementById('rcAccountModeBtn').addEventListener('click', function () {
      mode = (mode === 'signin') ? 'signup' : 'signin';
      renderMode();
    });
  }
  renderMode();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var sb = RCAccount.getClient();
    if (!sb) {
      errEl.textContent = 'Sign-in is unavailable right now -- please try again later.';
      return;
    }
    errEl.textContent = '';
    noticeEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'signin' ? 'Signing in...' : 'Creating account...';

    var email = document.getElementById('rcEmail').value.trim();
    var password = document.getElementById('rcPassword').value;

    var action = (mode === 'signin')
      ? sb.auth.signInWithPassword({ email: email, password: password })
      : sb.auth.signUp({ email: email, password: password });

    action.then(function (res) {
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'signin' ? 'Sign In' : 'Create Account';

      if (res.error) {
        errEl.textContent = res.error.message || 'Something went wrong. Please try again.';
        return;
      }
      if (res.data && res.data.session) {
        window.location.href = '/account/';
        return;
      }
      if (mode === 'signup') {
        noticeEl.textContent = 'Account created. Check your email to confirm it, then sign in.';
        mode = 'signin';
        renderMode();
      } else {
        errEl.textContent = 'Signed in, but no session was returned. Please try again.';
      }
    }).catch(function (err) {
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
      errEl.textContent = (err && err.message) ? err.message : 'Something went wrong. Please try again.';
    });
  });
})();
</script>
