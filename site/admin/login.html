<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | June Digitals</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="a-login-wrap">
    <div class="a-login-box">
      <img class="a-login-logo" src="/assets/brand/junedigitals-logo-transparent.png" alt="June Digitals">
      <h1>Sign in to Admin</h1>
      <p class="a-login-sub">Manage rentals, renters and the live catalog.</p>
      <form id="loginForm">
        <div class="a-field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required autofocus>
        </div>
        <div class="a-field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <label class="a-checkbox-row">
          <input id="rememberMe" type="checkbox" checked>
          <span>Remember me on this device</span>
        </label>
        <button type="submit" class="a-btn a-btn-primary" id="signInBtn">Sign In</button>
        <p class="a-error" id="loginError"></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/admin/config.js"></script>
  <script src="/admin/admin.js"></script>
  <script>
    (function () {
      if (!window.rcSupabase) return;
      window.rcSupabase.auth.getSession().then(function (res) {
        if (res.data && res.data.session) window.location.href = '/admin/dashboard.html';
      });

      var form = document.getElementById('loginForm');
      var btn = document.getElementById('signInBtn');
      var errEl = document.getElementById('loginError');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errEl.textContent = '';
        btn.disabled = true;
        btn.textContent = 'Signing in...';

        var remember = document.getElementById('rememberMe').checked;
        try {
          if (remember) sessionStorage.removeItem('rc_no_remember');
          else sessionStorage.setItem('rc_no_remember', '1');
        } catch (err) {}
        // admin.js already created window.rcSupabase using whichever
        // storage the PREVIOUS marker state pointed to -- build a client
        // scoped to what was just chosen so this sign-in actually lands
        // in the right place.
        var authClient = window.supabase.createClient(
          window.RC_ADMIN_CONFIG.SUPABASE_URL,
          window.RC_ADMIN_CONFIG.SUPABASE_ANON_KEY,
          { auth: { persistSession: true, storage: remember ? window.localStorage : window.sessionStorage } }
        );

        authClient.auth.signInWithPassword({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        }).then(function (res) {
          if (res.error) {
            errEl.textContent = res.error.message;
            btn.disabled = false;
            btn.textContent = 'Sign In';
            return;
          }
          window.location.href = '/admin/dashboard.html';
        });
      });
    })();
  </script>
</body>
</html>
